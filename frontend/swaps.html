<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardSwap — Swaps</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>

  <nav id="navbar">
    <a href="/" class="logo">CardSwap</a>
    <div id="nav-auth"></div>
  </nav>

  <div id="app">
    <section class="section">
      <h2 style="margin:0 0 0.35rem;">Swap Crypto</h2>
      <p class="muted" style="margin:0;">All open swap offers from other users. Trade one coin for another directly on the ledger — a 1% fee applies. Want to post your own? <a href="/my-swaps.html">Go to My Swaps →</a></p>

      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-end;margin-top:1rem;">
        <label style="display:flex;flex-direction:column;gap:0.3rem;font-size:0.8rem;color:var(--muted);">
          You'll receive
          <select id="filter-get-coin" class="form-input" style="min-width:110px;"></select>
        </label>
        <label style="display:flex;flex-direction:column;gap:0.3rem;font-size:0.8rem;color:var(--muted);">
          You'll pay with
          <select id="filter-give-coin" class="form-input" style="min-width:110px;"></select>
        </label>
        <label style="display:flex;flex-direction:column;gap:0.3rem;font-size:0.8rem;color:var(--muted);">
          Min size ($)
          <input id="filter-min-usd" type="number" min="0" step="any" placeholder="e.g. 100" class="form-input" style="width:110px;" />
        </label>
        <label style="display:flex;flex-direction:column;gap:0.3rem;font-size:0.8rem;color:var(--muted);">
          Max size ($)
          <input id="filter-max-usd" type="number" min="0" step="any" placeholder="e.g. 1000" class="form-input" style="width:110px;" />
        </label>
        <button id="btn-clear-swap-filters" type="button" class="btn-sm btn-secondary">Clear Filters</button>
      </div>

      <div id="swaps-list" class="trade-cards-grid" style="margin-top:1.1rem;">
        <p class="muted">Loading…</p>
      </div>
    </section>
  </div>

  <script type="module" src="/src/pages/swaps-page.js"></script>
</body>
</html>
