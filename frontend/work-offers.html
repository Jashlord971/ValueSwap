<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardSwap — My Work Offers</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>

  <nav id="navbar">
    <a href="/" class="logo">CardSwap</a>
    <div id="nav-auth"></div>
  </nav>

  <div id="app">
    <div class="page-header page-header-split">
      <div>
        <h1>My Work Offers</h1>
        <p class="muted">Create and manage contract work offers quoted in crypto.</p>
      </div>
      <button id="btn-new-work-offer" class="btn-sm">+ Add Work Offer</button>
    </div>

    <section class="section card">
      <div id="work-offers-list"></div>
    </section>
  </div>

  <div id="work-offer-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="work-offer-modal-title">
    <div class="modal offer-modal">
      <div class="modal-header">
        <h3 id="work-offer-modal-title">New Work Offer</h3>
        <button id="close-work-offer-modal" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <label for="work-title">Offer title</label>
          <input id="work-title" class="form-input" type="text" maxlength="120" placeholder="e.g. Design a landing page" />
        </div>
        <div class="field-row">
          <label for="work-category">Category</label>
          <input id="work-category" class="form-input" type="text" maxlength="60" placeholder="e.g. Design, Dev, Writing" />
        </div>
        <div class="field-row">
          <label for="work-pay-coin">Payment coin</label>
          <select id="work-pay-coin" class="form-input">
            <option value="BTC">BTC</option>
            <option value="ETH">ETH</option>
            <option value="USDT">USDT</option>
            <option value="USDC">USDC</option>
            <option value="TRX">TRX</option>
          </select>
        </div>
        <div class="field-row">
          <label for="work-pay-amount">Budget</label>
          <input id="work-pay-amount" class="form-input" type="number" min="0" step="0.00000001" placeholder="e.g. 50" />
        </div>
        <div class="field-row">
          <label for="work-details">Details</label>
          <textarea id="work-details" rows="4" maxlength="800" placeholder="Describe deliverables, timeline, and requirements."></textarea>
        </div>
        <p id="work-offer-error" class="error"></p>
        <button id="btn-submit-work-offer" style="width:100%">Save Work Offer</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="/src/pages/work-offers-page.js"></script>
</body>
</html>
