<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardSwap — My Offers</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>

  <nav id="navbar">
    <a href="/" class="logo">CardSwap</a>
    <div id="nav-auth"></div>
  </nav>

  <div id="app">
    <div class="page-header page-header-split">
      <h1>My Offers</h1>
      <button id="btn-new-offer" class="btn-sm">+ Add Offer</button>
    </div>

    <section class="section card">
      <div class="tab-bar tab-bar-box">
        <button type="button" id="offers-tab-sell" class="tab-btn tab-btn-box active" data-tab="sell">Sell</button>
        <button type="button" id="offers-tab-buy" class="tab-btn tab-btn-box" data-tab="buy">Buy</button>
      </div>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1.1rem;">
        <label style="display:flex;flex-direction:column;gap:0.3rem;font-size:0.8rem;color:var(--muted);">
          Status
          <select id="offers-filter-status" class="form-input" style="min-width:110px;">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </label>
      </div>
      <div id="offers-list"></div>
    </section>

  </div>

  <div id="offer-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="offer-modal-title">
    <div class="modal offer-modal">
      <div class="modal-header">
        <h3 id="offer-modal-title">New Offer</h3>
        <button id="close-offer-modal" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">

        <div class="field-row">
          <label>I want to</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="offer-type" value="sell" checked />
              <span>Sell crypto</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="offer-type" value="buy" />
              <span>Buy crypto</span>
            </label>
          </div>
        </div>

        <div class="field-row">
          <label>Payment Method</label>
          <div class="searchable-select" id="pm-picker-wrap">
            <input id="offer-card-search" class="form-input" type="text" autocomplete="off"
              placeholder="Search payment method…" />
            <input type="hidden" id="offer-card" />
            <ul id="offer-card-dropdown" class="search-dropdown hidden"></ul>
          </div>
        </div>

        <div class="field-row" id="currency-field-row">
          <label>Currency</label>
          <div class="searchable-select" id="currency-picker-wrap">
            <input id="offer-currency-search" class="form-input" type="text" autocomplete="off"
              placeholder="Choose payment method first" disabled />
            <input type="hidden" id="offer-currency" />
            <ul id="offer-currency-dropdown" class="search-dropdown hidden"></ul>
          </div>
          <small id="offer-escrow-info" class="muted" style="margin-top:0.35rem;display:none"></small>
        </div>

        <div class="field-row">
          <label for="offer-coin">Cryptocurrency</label>
          <select id="offer-coin" class="form-input" required>
            <option value="">Select a coin</option>
            <option value="BTC">Bitcoin (BTC)</option>
            <option value="ETH">Ethereum (ETH)</option>
            <option value="USDT">Tether (USDT)</option>
            <option value="USDC">USD Coin (USDC)</option>
          </select>
        </div>

        <div class="field-row">
          <label for="offer-terms">
            Trade Terms
            <span class="field-hint">(max 500 chars — no HTML)</span>
          </label>
          <textarea id="offer-terms" rows="4" maxlength="500"
            placeholder="e.g. Send card photo first. I release within 10 min of verification."></textarea>
          <small id="offer-terms-count" class="muted char-count">0 / 500</small>
        </div>

        <div class="field-row">
          <label for="offer-profit">
            Profit Rate
            <span class="field-hint">(-100% to 200%)</span>
          </label>
          <input id="offer-profit" type="number" min="-100" max="200" step="0.1"
            placeholder="e.g. 15" />
        </div>

        <div class="field-row">
          <label for="offer-time-limit">Trade Time Limit</label>
          <select id="offer-time-limit" class="form-input">
            <option value="900">15 minutes</option>
            <option value="1800" selected>30 minutes (default)</option>
            <option value="3600">1 hour</option>
          </select>
        </div>

        <div style="display:flex;gap:1rem">
          <div class="field-row" style="flex:1">
            <label for="offer-min-amount">
              Minimum Trade Amount
            </label>
            <div class="amount-input-suffix">
              <input id="offer-min-amount" type="number" min="0" step="0.01"
                placeholder="e.g. 50" />
              <span id="offer-min-amount-currency" class="amount-input-suffix-badge"></span>
            </div>
          </div>
          <div class="field-row" style="flex:1">
            <label for="offer-max-amount">
              Maximum Trade Amount
            </label>
            <div class="amount-input-suffix">
              <input id="offer-max-amount" type="number" min="0" step="0.01"
                placeholder="e.g. 500" />
              <span id="offer-max-amount-currency" class="amount-input-suffix-badge"></span>
            </div>
          </div>
        </div>

        <p id="offer-modal-error" class="error"></p>
        <button id="btn-submit-offer" style="width:100%">Post Offer</button>
      </div>
    </div>
  </div>

  <div id="delete-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal confirm-modal">
      <div class="modal-header">
        <h3>Delete Offer</h3>
        <button id="close-delete-modal" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this offer? This cannot be undone.</p>
        <div class="confirm-modal-actions">
          <button id="btn-delete-cancel" class="btn-secondary">Cancel</button>
          <button id="btn-delete-confirm" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="/src/pages/offers-page.js"></script>
</body>
</html>
