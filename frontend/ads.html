<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardSwap - P2P Ads</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>

  <nav id="navbar">
    <a href="/" class="logo">CardSwap</a>
    <div id="nav-auth"></div>
  </nav>

  <div id="app">
    <div class="page-header page-header-split">
      <div>
        <h1>P2P Ads</h1>
        <p class="muted">Post an ad or watch ads and earn cents.</p>
      </div>
      <div class="card" style="padding:0.65rem 0.95rem;min-width:220px;">
        <div class="muted" style="font-size:0.78rem;">Ad Watch Earnings</div>
        <div id="ads-earned-total" style="font-size:1.15rem;font-weight:700;">$0.00</div>
      </div>
    </div>

    <section class="section card">
      <h2 style="margin-bottom:0.75rem;">Post A New Ad</h2>
      <div class="modal-body" style="margin-top:0;">
        <div class="field-row">
          <label for="ad-title">Ad title</label>
          <input id="ad-title" class="form-input" type="text" maxlength="120" placeholder="e.g. Join my crypto newsletter" />
        </div>
        <div class="field-row">
          <label for="ad-description">Ad message</label>
          <textarea id="ad-description" rows="3" maxlength="500" placeholder="Describe what viewers should know or do."></textarea>
        </div>
        <div class="field-row">
          <label for="ad-link">Ad link (URL)</label>
          <input id="ad-link" class="form-input" type="url" placeholder="https://example.com" />
        </div>
        <div class="field-row">
          <label>Questionnaire (up to 4 questions)</label>
          <div id="ad-question-builder" style="display:flex;flex-direction:column;gap:0.55rem;">
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
              <select class="form-input ad-q-type" style="max-width:180px;">
                <option value="none" selected>No question</option>
                <option value="yesno">Yes / No</option>
                <option value="short">Short answer</option>
              </select>
              <input class="form-input ad-q-text" type="text" maxlength="140" placeholder="Question 1" style="flex:1;min-width:220px;" />
            </div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
              <select class="form-input ad-q-type" style="max-width:180px;">
                <option value="none" selected>No question</option>
                <option value="yesno">Yes / No</option>
                <option value="short">Short answer</option>
              </select>
              <input class="form-input ad-q-text" type="text" maxlength="140" placeholder="Question 2" style="flex:1;min-width:220px;" />
            </div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
              <select class="form-input ad-q-type" style="max-width:180px;">
                <option value="none" selected>No question</option>
                <option value="yesno">Yes / No</option>
                <option value="short">Short answer</option>
              </select>
              <input class="form-input ad-q-text" type="text" maxlength="140" placeholder="Question 3" style="flex:1;min-width:220px;" />
            </div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
              <select class="form-input ad-q-type" style="max-width:180px;">
                <option value="none" selected>No question</option>
                <option value="yesno">Yes / No</option>
                <option value="short">Short answer</option>
              </select>
              <input class="form-input ad-q-text" type="text" maxlength="140" placeholder="Question 4" style="flex:1;min-width:220px;" />
            </div>
          </div>
          <small class="muted">Advertiser receives watcher responses after completion.</small>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
          <div class="field-row" style="flex:1;min-width:160px;">
            <label for="ad-reward-cents">Reward per watch (cents)</label>
            <input id="ad-reward-cents" class="form-input" type="number" min="1" max="100" step="1" placeholder="e.g. 5" />
          </div>
          <div class="field-row" style="flex:1;min-width:160px;">
            <label for="ad-watch-secs">Watch time (seconds)</label>
            <input id="ad-watch-secs" class="form-input" type="number" min="5" max="120" step="1" placeholder="e.g. 15" />
          </div>
        </div>
        <p id="ad-post-error" class="error"></p>
        <button id="btn-post-ad">Post Ad</button>
      </div>
    </section>

    <section class="section card">
      <h2 style="margin-bottom:0.75rem;">Watch Ads</h2>
      <div id="ads-list"></div>
    </section>
  </div>

  <div id="watch-ad-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="watch-ad-title">
    <div class="modal" style="max-width:900px;">
      <div class="modal-header">
        <h3 id="watch-ad-title">Watch Ad</h3>
        <button id="close-watch-ad-modal" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" style="margin-top:0.5rem;gap:0.75rem;">
        <div id="watch-ad-frame-wrap" style="border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#020817;">
          <iframe id="watch-ad-frame" title="Ad frame" style="width:100%;height:360px;border:none;"></iframe>
        </div>
        <div id="watch-ad-status" class="muted"></div>
        <div id="watch-ad-questions" class="hidden"></div>
        <div id="watch-ad-actions" style="display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:flex-end;">
          <a id="watch-ad-link" class="btn-sm btn-secondary hidden" target="_blank" rel="noopener noreferrer">Visit Advertiser Website</a>
          <button id="btn-submit-ad-answers" class="hidden">Submit Answers</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/ads-page.js"></script>
</body>
</html>
