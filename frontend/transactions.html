<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardSwap — Transactions</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>

  <nav id="navbar">
    <a href="/" class="logo">CardSwap</a>
    <div id="nav-auth"></div>
  </nav>

  <div id="app">
    <div class="page-header">
      <h1>Transactions</h1>
      <p class="muted">Everything that's added to your balance — internal transfers, deposits, and trade payouts.</p>
    </div>

    <section class="section card" id="pending-withdrawals-section" style="display:none;">
      <h2 style="margin-top:0;">Pending Withdrawals</h2>
      <p class="muted" style="font-size:0.85rem;">
        Withdrawals are paid out of the platform treasury, not signed instantly — queued ones are
        processed as soon as funds are available.
      </p>
      <div id="pending-withdrawals-list"></div>
    </section>

    <section class="section card">
      <div id="transactions-list"><p class="muted">Loading…</p></div>
    </section>
  </div>

  <script type="module" src="/src/pages/transactions-page.js"></script>
</body>
</html>
